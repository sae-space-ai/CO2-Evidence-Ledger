name: CI/CD Pipeline

on:
  push:
    branches: [main, feat/co2-evidence-ledger-*]
  pull_request:
    branches: [main]

jobs:
  # ============ BACKEND ============
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Go fmt
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "Files not formatted:"
            echo "$files"
            exit 1
          fi

      - name: Go vet
        run: go vet ./...

      - name: Go build
        run: |
          go build ./cmd/server/...
          go build ./cmd/bootstrap/...
          go build ./cmd/verify-package/...

      - name: Go test (unit)
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./internal/...

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.txt

  # ============ BACKEND INTEGRATION ============
  backend-integration:
    name: Backend Integration
    runs-on: ubuntu-latest
    needs: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: co2evidence_test
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run migrations
        env:
          DATABASE_URL: postgres://testuser:testpass@localhost:5432/co2evidence_test?sslmode=disable
        run: |
          go run cmd/server/main.go &
          sleep 3
          curl -f http://localhost:8080/api/ready || exit 1
          kill %1

      - name: Integration tests
        env:
          DATABASE_URL: postgres://testuser:testpass@localhost:5432/co2evidence_test?sslmode=disable
        run: go test -v -tags=integration ./internal/...

  # ============ FRONTEND ============
  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/

  # ============ DEPLOY PREVIEW ============
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Comment PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ CI passed. Ready for preview deployment.'
            })
